<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" font-family="Verdana, DejaVu Sans, sans-serif">

  <rect width="960" height="540" fill="#ffffff"/>

  <!-- titulo -->
  <text x="40" y="46" font-size="24" font-weight="bold" fill="#1f2937">Las queratinas de la piel</text>
  <rect x="40" y="58" width="520" height="3.5" fill="#8f2436"/>

  <!-- ===== corte de epidermis ===== -->
  <g transform="translate(90,92)">

    <!-- fondo de los estratos -->
    <rect x="0" y="0"   width="230" height="62"  fill="#fdf3e7"/>
    <rect x="0" y="62"  width="230" height="60"  fill="#fbe9dc"/>
    <rect x="0" y="122" width="230" height="140" fill="#fdf6ef"/>
    <rect x="0" y="262" width="230" height="68"  fill="#f7e8e2"/>
    <rect x="0" y="330" width="230" height="56"  fill="#f3e3d6"/>
    <rect x="0" y="0" width="230" height="386" fill="none" stroke="#d9c3b2" stroke-width="1.5"/>

    <!-- estrato corneo: escamas sin nucleo -->
    <g stroke="#c0633f" stroke-width="1.4" fill="#ffffff">
      <rect x="8"  y="6"  width="68" height="12" rx="4"/><rect x="82" y="6"  width="68" height="12" rx="4"/><rect x="156" y="6" width="66" height="12" rx="4"/>
      <rect x="8"  y="22" width="68" height="12" rx="4"/><rect x="82" y="22" width="68" height="12" rx="4"/><rect x="156" y="22" width="66" height="12" rx="4"/>
      <rect x="8"  y="38" width="68" height="12" rx="4"/><rect x="82" y="38" width="68" height="12" rx="4"/><rect x="156" y="38" width="66" height="12" rx="4"/>
    </g>

    <!-- estrato granuloso -->
    <g stroke="#c0633f" stroke-width="1.6" fill="#ffffff">
      <rect x="8" y="68" width="68" height="22" rx="5"/><rect x="82" y="68" width="68" height="22" rx="5"/><rect x="156" y="68" width="66" height="22" rx="5"/>
      <rect x="8" y="94" width="68" height="22" rx="5"/><rect x="82" y="94" width="68" height="22" rx="5"/><rect x="156" y="94" width="66" height="22" rx="5"/>
    </g>
    <g fill="#111827">
      <circle cx="30" cy="79" r="4"/><circle cx="104" cy="79" r="4"/><circle cx="178" cy="79" r="4"/>
      <circle cx="42" cy="105" r="4"/><circle cx="116" cy="105" r="4"/><circle cx="190" cy="105" r="4"/>
    </g>
    <g fill="#8f8f6a">
      <circle cx="52" cy="76" r="2.2"/><circle cx="62" cy="83" r="2.2"/><circle cx="126" cy="76" r="2.2"/>
      <circle cx="136" cy="84" r="2.2"/><circle cx="198" cy="76" r="2.2"/><circle cx="60" cy="102" r="2.2"/>
      <circle cx="134" cy="109" r="2.2"/><circle cx="206" cy="103" r="2.2"/>
    </g>

    <!-- estrato espinoso -->
    <g stroke="#c0633f" stroke-width="1.6" fill="#ffffff">
      <rect x="8" y="128" width="68" height="40" rx="6"/><rect x="82" y="128" width="68" height="40" rx="6"/><rect x="156" y="128" width="66" height="40" rx="6"/>
      <rect x="8" y="172" width="68" height="40" rx="6"/><rect x="82" y="172" width="68" height="40" rx="6"/><rect x="156" y="172" width="66" height="40" rx="6"/>
      <rect x="8" y="216" width="68" height="40" rx="6"/><rect x="82" y="216" width="68" height="40" rx="6"/><rect x="156" y="216" width="66" height="40" rx="6"/>
    </g>
    <!-- red de filamentos y desmosomas -->
    <g stroke="#6cc24a" stroke-width="0.9" fill="none" opacity="0.8">
      <path d="M12,132 L72,164 M72,132 L12,164"/><path d="M86,132 L146,164 M146,132 L86,164"/><path d="M160,132 L218,164 M218,132 L160,164"/>
      <path d="M12,176 L72,208 M72,176 L12,208"/><path d="M86,176 L146,208 M146,176 L86,208"/><path d="M160,176 L218,208 M218,176 L160,208"/>
      <path d="M12,220 L72,252 M72,220 L12,252"/><path d="M86,220 L146,252 M146,220 L86,252"/><path d="M160,220 L218,252 M218,220 L160,252"/>
    </g>
    <g fill="#4a90c2">
      <rect x="73" y="144" width="8" height="8" rx="2"/><rect x="147" y="144" width="8" height="8" rx="2"/>
      <rect x="73" y="188" width="8" height="8" rx="2"/><rect x="147" y="188" width="8" height="8" rx="2"/>
      <rect x="73" y="232" width="8" height="8" rx="2"/><rect x="147" y="232" width="8" height="8" rx="2"/>
    </g>
    <g fill="#111827">
      <circle cx="40" cy="148" r="7"/><circle cx="114" cy="148" r="7"/><circle cx="188" cy="148" r="7"/>
      <circle cx="40" cy="192" r="7"/><circle cx="114" cy="192" r="7"/><circle cx="188" cy="192" r="7"/>
      <circle cx="40" cy="236" r="7"/><circle cx="114" cy="236" r="7"/><circle cx="188" cy="236" r="7"/>
    </g>

    <!-- estrato basal -->
    <g stroke="#c0633f" stroke-width="1.8" fill="#ffffff">
      <rect x="8" y="270" width="40" height="52" rx="7"/><rect x="54" y="270" width="40" height="52" rx="7"/>
      <rect x="100" y="270" width="40" height="52" rx="7"/><rect x="146" y="270" width="40" height="52" rx="7"/>
      <rect x="192" y="270" width="30" height="52" rx="7"/>
    </g>
    <g fill="#111827">
      <circle cx="28" cy="298" r="9"/><circle cx="74" cy="298" r="9"/><circle cx="120" cy="298" r="9"/>
      <circle cx="166" cy="298" r="9"/><circle cx="207" cy="298" r="8"/>
    </g>

    <!-- membrana basal y dermis -->
    <line x1="0" y1="330" x2="230" y2="330" stroke="#8f2436" stroke-width="2.5"/>
    <text x="115" y="348" text-anchor="middle" font-size="9.5" fill="#8f2436">membrana basal</text>
    <g stroke="#d8b9a6" stroke-width="1.2" fill="none">
      <path d="M12,364 q26,-10 52,0 q26,10 52,0 q26,-10 52,0 q26,10 52,0"/>
      <path d="M12,376 q26,10 52,0 q26,-10 52,0 q26,10 52,0 q26,-10 52,0"/>
    </g>
    <text x="115" y="400" text-anchor="middle" font-size="10" fill="#9aa1a9">dermis</text>
  </g>

  <!-- ===== etiquetas de los estratos ===== -->

  <!-- corneo -->
  <g>
    <line x1="326" y1="122" x2="404" y2="122" stroke="#c9ced6" stroke-width="1.4" stroke-dasharray="4 4"/>
    <text x="416" y="112" font-size="12.5" font-weight="bold" fill="#39414f">Estrato córneo</text>
    <text x="416" y="130" font-size="10.5" fill="#6b7280">células muertas, sin núcleo: la barrera</text>
  </g>

  <!-- granuloso -->
  <g>
    <line x1="326" y1="186" x2="404" y2="186" stroke="#c9ced6" stroke-width="1.4" stroke-dasharray="4 4"/>
    <text x="416" y="170" font-size="12.5" font-weight="bold" fill="#39414f">Estrato granuloso <tspan font-weight="normal" fill="#6b7280" font-size="10.5">· diferenciación tardía</tspan></text>
    <text x="416" y="196" font-size="19" font-weight="bold" fill="#8f2436">K2 + K10</text>
    <text x="416" y="214" font-size="10.5" fill="#6b7280">si falla: ictiosis epidermolítica superficial</text>
  </g>

  <!-- espinoso : destacado -->
  <g>
    <rect x="404" y="240" width="516" height="80" rx="8" fill="#fbeaec"/>
    <line x1="326" y1="280" x2="404" y2="280" stroke="#c9ced6" stroke-width="1.4" stroke-dasharray="4 4"/>
    <text x="420" y="266" font-size="12.5" font-weight="bold" fill="#39414f">Estrato espinoso <tspan font-weight="normal" fill="#6b7280" font-size="10.5">· diferenciación temprana</tspan></text>
    <text x="420" y="294" font-size="21" font-weight="bold" fill="#8f2436">K1 + K10</text>
    <text x="420" y="312" font-size="11" font-weight="bold" fill="#8f2436">si falla: ictiosis epidermolítica  ←  nuestra enfermedad</text>
  </g>

  <!-- basal -->
  <g>
    <line x1="326" y1="390" x2="404" y2="390" stroke="#c9ced6" stroke-width="1.4" stroke-dasharray="4 4"/>
    <text x="416" y="374" font-size="12.5" font-weight="bold" fill="#39414f">Estrato basal <tspan font-weight="normal" fill="#6b7280" font-size="10.5">· célula progenitora</tspan></text>
    <text x="416" y="400" font-size="19" font-weight="bold" fill="#8f2436">K5 + K14</text>
    <text x="536" y="400" font-size="13" font-weight="bold" fill="#b06a76">y K5 + K15</text>
    <text x="416" y="418" font-size="10.5" fill="#6b7280">si falla: epidermólisis ampollosa simple</text>
  </g>

  <!-- nota final -->
  <g transform="translate(404,444)">
    <rect x="0" y="0" width="516" height="52" rx="8" fill="#f2f3f5"/>
    <text x="258" y="22" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#39414f">Cada estrato enciende su propia pareja de queratinas</text>
    <text x="258" y="40" text-anchor="middle" font-size="10.5" fill="#6b7280">una de tipo I y otra de tipo II: si falta una, la pareja no se forma</text>
  </g>
</svg>
