<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" font-family="Verdana, DejaVu Sans, sans-serif">

  <defs>
    <marker id="up" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#9aa1a9"/>
    </marker>
    <marker id="gr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8f2436"/>
    </marker>
  </defs>

  <rect width="960" height="540" fill="#ffffff"/>

  <!-- titulo -->
  <text x="40" y="46" font-size="24" font-weight="bold" fill="#1f2937">¿Qué son las queratinas?</text>
  <rect x="40" y="58" width="520" height="3.5" fill="#8f2436"/>

  <!-- celulas de la epidermis -->
  <g transform="translate(52,110)">
    <text x="92" y="-12" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#39414f">Dentro del queratinocito</text>
    <g stroke="#c0633f" stroke-width="1.8" fill="#ffffff">
      <rect x="0" y="0" width="60" height="26" rx="3"/><rect x="62" y="0" width="60" height="26" rx="3"/><rect x="124" y="0" width="60" height="26" rx="3"/>
      <rect x="0" y="30" width="60" height="46" rx="4"/><rect x="62" y="30" width="60" height="46" rx="4"/><rect x="124" y="30" width="60" height="46" rx="4"/>
      <rect x="0" y="80" width="60" height="66" rx="5"/><rect x="62" y="80" width="60" height="66" rx="5"/><rect x="124" y="80" width="60" height="66" rx="5"/>
      <rect x="0" y="150" width="60" height="86" rx="6"/><rect x="62" y="150" width="60" height="86" rx="6"/><rect x="124" y="150" width="60" height="86" rx="6"/>
    </g>
    <!-- red de filamentos -->
    <g stroke="#6cc24a" stroke-width="1" opacity="0.85" fill="none">
      <path d="M4,4 L56,22 M56,4 L4,22 M4,13 h52"/>
      <path d="M66,4 L118,22 M118,4 L66,22 M66,13 h52"/>
      <path d="M128,4 L180,22 M180,4 L128,22 M128,13 h52"/>
      <path d="M4,34 L56,72 M56,34 L4,72"/><path d="M66,34 L118,72 M118,34 L66,72"/><path d="M128,34 L180,72 M180,34 L128,72"/>
      <path d="M4,84 L56,142 M56,84 L4,142"/><path d="M66,84 L118,142 M118,84 L66,142"/><path d="M128,84 L180,142 M180,84 L128,142"/>
    </g>
    <!-- desmosomas -->
    <g fill="#4a90c2">
      <rect x="57" y="24" width="8" height="8" rx="2"/><rect x="119" y="24" width="8" height="8" rx="2"/>
      <rect x="57" y="72" width="8" height="8" rx="2"/><rect x="119" y="72" width="8" height="8" rx="2"/>
      <rect x="57" y="142" width="8" height="8" rx="2"/><rect x="119" y="142" width="8" height="8" rx="2"/>
    </g>
    <!-- nucleos -->
    <g fill="#111827">
      <circle cx="30" cy="55" r="6"/><circle cx="92" cy="55" r="6"/><circle cx="154" cy="55" r="6"/>
      <circle cx="26" cy="112" r="10"/><circle cx="92" cy="112" r="10"/><circle cx="158" cy="112" r="10"/>
      <circle cx="26" cy="200" r="12"/><circle cx="92" cy="185" r="12"/><circle cx="158" cy="205" r="12"/>
    </g>
    <text x="92" y="258" text-anchor="middle" font-size="10" fill="#6b7280">los filamentos de queratina sostienen la célula</text>
  </g>

  <!-- lineas de zoom -->
  <path d="M250,118 L344,96" stroke="#8a8f98" stroke-width="1.2" fill="none"/>
  <path d="M250,228 L344,462" stroke="#8a8f98" stroke-width="1.2" fill="none"/>

  <!-- panel de ensamblaje -->
  <rect x="344" y="88" width="252" height="382" rx="10" fill="#f2f3f5"/>
  <line x1="360" y1="452" x2="360" y2="120" stroke="#9aa1a9" stroke-width="1.6" marker-end="url(#up)"/>
  <text x="352" y="286" font-size="9.5" fill="#9aa1a9" transform="rotate(-90 352,286)" text-anchor="middle">se van ensamblando</text>

  <!-- 1: monomeros -->
  <g transform="translate(386,436)">
    <path d="M0,0 h74" stroke="#e2664f" stroke-width="7" stroke-linecap="round"/>
    <circle cx="80" cy="0" r="7" fill="#e8a33d"/>
    <path d="M90,14 h74" stroke="#9ec97f" stroke-width="7" stroke-linecap="round"/>
    <circle cx="170" cy="14" r="7" fill="#cfe3bd"/>
    <text x="0" y="-22" font-size="10.5" font-weight="bold" fill="#c0392b">Queratina tipo I</text>
    <text x="118" y="-22" font-size="10.5" font-weight="bold" fill="#2f6f9e">tipo II</text>
  </g>

  <!-- 2: dimero -->
  <g transform="translate(400,374)">
    <path d="M0,6 q20,-12 40,0 q20,12 40,0 q20,-12 40,0" fill="none" stroke="#e2664f" stroke-width="5" stroke-linecap="round"/>
    <path d="M0,6 q20,12 40,0 q20,-12 40,0 q20,12 40,0" fill="none" stroke="#9ec97f" stroke-width="5" stroke-linecap="round"/>
    <circle cx="0" cy="6" r="7" fill="#e8a33d"/><circle cx="120" cy="6" r="7" fill="#cfe3bd"/>
    <text x="150" y="10" font-size="11" fill="#39414f">Dímero</text>
  </g>

  <!-- 3: tetramero -->
  <g transform="translate(392,310)">
    <g>
      <path d="M0,0 q20,-9 40,0 q20,9 40,0 q20,-9 40,0" fill="none" stroke="#e2664f" stroke-width="4.5" stroke-linecap="round"/>
      <path d="M0,0 q20,9 40,0 q20,-9 40,0 q20,9 40,0" fill="none" stroke="#9ec97f" stroke-width="4.5" stroke-linecap="round"/>
      <circle cx="0" cy="0" r="6" fill="#e8a33d"/><circle cx="120" cy="0" r="6" fill="#cfe3bd"/>
    </g>
    <g transform="translate(14,16)">
      <path d="M0,0 q20,-9 40,0 q20,9 40,0 q20,-9 40,0" fill="none" stroke="#9ec97f" stroke-width="4.5" stroke-linecap="round"/>
      <path d="M0,0 q20,9 40,0 q20,-9 40,0 q20,9 40,0" fill="none" stroke="#e2664f" stroke-width="4.5" stroke-linecap="round"/>
      <circle cx="0" cy="0" r="6" fill="#cfe3bd"/><circle cx="120" cy="0" r="6" fill="#e8a33d"/>
    </g>
    <text x="156" y="12" font-size="11" fill="#39414f">Tetrámero</text>
  </g>

  <!-- 4: unidad minima -->
  <g transform="translate(392,230)">
    <rect x="0" y="-13" width="128" height="26" rx="13" fill="#cfe3bd" stroke="#9ec97f" stroke-width="2"/>
    <g fill="none" stroke="#e2664f" stroke-width="3" stroke-linecap="round" opacity="0.95">
      <path d="M8,-6 q16,-6 32,0 q16,6 32,0 q16,-6 32,0 q12,5 16,2"/>
      <path d="M8,6 q16,6 32,0 q16,-6 32,0 q16,6 32,0 q12,-5 16,-2"/>
    </g>
    <g fill="#e8a33d">
      <circle cx="12" cy="-14" r="6"/><circle cx="44" cy="-14" r="6"/><circle cx="84" cy="-14" r="6"/><circle cx="116" cy="-14" r="6"/>
      <circle cx="12" cy="14" r="6"/><circle cx="44" cy="14" r="6"/><circle cx="84" cy="14" r="6"/><circle cx="116" cy="14" r="6"/>
    </g>
    <text x="150" y="-4" font-size="11" fill="#39414f">Unidad</text>
    <text x="150" y="10" font-size="11" fill="#39414f">mínima</text>
  </g>

  <!-- 5: filamento -->
  <g transform="translate(386,146)">
    <g stroke="#9ec97f" stroke-width="3.5" fill="none" stroke-linecap="round">
      <path d="M0,-8 q22,-10 44,0 q22,10 44,0 q22,-10 44,0"/>
      <path d="M0,8 q22,10 44,0 q22,-10 44,0 q22,10 44,0"/>
      <path d="M0,0 h132"/>
    </g>
    <g fill="#e8a33d">
      <circle cx="16" cy="-9" r="6"/><circle cx="56" cy="-9" r="6"/><circle cx="96" cy="-9" r="6"/><circle cx="128" cy="-9" r="6"/>
      <circle cx="16" cy="9" r="6"/><circle cx="56" cy="9" r="6"/><circle cx="96" cy="9" r="6"/><circle cx="128" cy="9" r="6"/>
    </g>
    <text x="0" y="-26" font-size="11" font-weight="bold" fill="#39414f">Filamento de queratina</text>
  </g>

  <!-- cajas tipo I / tipo II -->
  <g transform="translate(628,112)">
    <rect x="0" y="0" width="300" height="96" rx="8" fill="#ffffff" stroke="#8f2436" stroke-width="2"/>
    <text x="22" y="40" font-size="21" font-weight="bold" fill="#8f2436">Tipo I</text>
    <text x="118" y="38" font-size="12.5" fill="#6b7280">ácida y más pequeña</text>
    <text x="150" y="72" text-anchor="middle" font-size="17" font-weight="bold" fill="#1f2937">K9 · K10 · K14 · K15</text>
  </g>

  <g transform="translate(628,232)">
    <rect x="0" y="0" width="300" height="96" rx="8" fill="#ffffff" stroke="#2f5fa8" stroke-width="2"/>
    <text x="22" y="40" font-size="21" font-weight="bold" fill="#2f5fa8">Tipo II</text>
    <text x="128" y="38" font-size="12.5" fill="#6b7280">básica y más grande</text>
    <text x="150" y="72" text-anchor="middle" font-size="17" font-weight="bold" fill="#1f2937">K1 · K2 · K5</text>
  </g>

  <!-- regla de las parejas -->
  <g transform="translate(628,356)">
    <rect x="0" y="0" width="300" height="118" rx="8" fill="#fbf1f2"/>
    <text x="150" y="26" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#8f2436">Siempre van por parejas</text>
    <text x="150" y="44" text-anchor="middle" font-size="10.5" fill="#6b7280">cada tipo I necesita a su tipo II</text>
    <g font-size="12.5" font-weight="bold" fill="#1f2937" text-anchor="middle">
      <text x="150" y="68">K1 + K10</text>
      <text x="150" y="88">K2 + K10</text>
      <text x="150" y="108">K5 + K14 · K5 + K15</text>
    </g>
  </g>
</svg>
